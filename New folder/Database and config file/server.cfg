## You CAN edit the following:
endpoint_add_tcp "0.0.0.0:30120"
endpoint_add_udp "0.0.0.0:30120"
sv_licenseKey "cfxk_6xRGhIbXit8hcjmUqyoH_4Ag4U1"
sv_maxclients 48
sv_enforceGameBuild 1491 #September 2022 update
set gamename rdr3
set steam_webApiKey "759E6153757EFD867E6E37E96EF61636"
set mysql_connection_string "mysql://root:@localhost/1899rp?charset=utf8mb4"
set mysql_slow_query_warning 200    # to only show warnings above 700
load_server_icon icon.png  #REPLACE the icon.png found in the folder to your logo 96x96
sets tags "roleplay, western, bandits"
set txAdmin-menuPtfxDisable true
## You SHOULD edit the following:
sv_hostname "1899 RP!"
sets sv_projectName "1899 RP"
sets sv_projectDesc "1899 RP is an immersive, story-driven RedM roleplay server set in the final days of the Old West. Dive into a world where your choices matter – whether you're a lawman, outlaw, or civilian. Join a community focused on high-quality, realistic roleplay with custom scripts and a thriving, dynamic economy."
sets locale "en-MA" # change to your language (eg. en-US, pt-BR, de-DE)
set resources_useSystemChat true #chat resource is now found within the artifacts

## Turns off the information about players joining and leaving the server on the chat.
set chat_showJoins false
set chat_showQuits false

